name: "SafeRun Package Security Check"
description: "Analyze npm packages or project dependencies in a SafeRun sandbox and optionally upload SARIF results."
inputs:
  packages:
    description: "Space-separated npm package specs to analyze (leave empty for project mode)"
    required: false
    default: ""
  sarif-file:
    description: "Workspace-relative path to write SARIF output"
    required: false
    default: "saferun.sarif"
  upload-sarif:
    description: "Upload SARIF report to GitHub Code Scanning"
    required: false
    default: "true"
  saferun-version:
    description: "Optional SafeRun release version. By default, build from this action's revision."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install SafeRun
      id: install
      shell: bash
      env:
        SAFERUN_VERSION: ${{ inputs.saferun-version }}
      run: |
        install_dir=$(mktemp -d "${RUNNER_TEMP}/saferun-bin.XXXXXXXX")
        cd "$GITHUB_ACTION_PATH/../../.."
        if [[ -z "$SAFERUN_VERSION" ]]; then
          go build -o "$install_dir/saferun" ./cmd/saferun
        else
          if [[ ! "$SAFERUN_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Expected a SafeRun release version such as v1.2.0." >&2
            exit 1
          fi
          SAFERUN_INSTALL_DIR="$install_dir" sh ./install.sh
        fi
        printf 'binary=%s\n' "$install_dir/saferun" >> "$GITHUB_OUTPUT"

    - name: Prepare SafeRun Sandbox
      shell: bash
      env:
        SAFERUN_BIN: ${{ steps.install.outputs.binary }}
      run: '"$SAFERUN_BIN" setup'

    - name: Run SafeRun Analysis
      id: analyze
      shell: bash
      env:
        SAFERUN_BIN: ${{ steps.install.outputs.binary }}
        SAFERUN_PACKAGES: ${{ inputs.packages }}
        SAFERUN_SARIF_FILE: ${{ inputs.sarif-file }}
      run: bash "$GITHUB_ACTION_PATH/analyze.sh"

    - name: Upload SARIF to GitHub Security
      if: ${{ inputs.upload-sarif == 'true' && steps.analyze.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif-file }}

    - name: Fail on Policy Block
      if: ${{ always() && steps.analyze.outputs.blocked == 'true' }}
      shell: bash
      run: |
        echo "SafeRun security policy blocked the installation." >&2
        exit 1
