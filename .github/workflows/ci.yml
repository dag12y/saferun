name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Test GitHub Action wrapper
        run: bash tests/action.sh

      - name: Test npm installation in Docker
        run: bash tests/npm-e2e.sh
